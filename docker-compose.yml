version: "3.8"

services:
  # Backend Spring Boot
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-gotodrop-back}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - backend-data:/app/data
    networks:
      - gotodrop-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React/Vite
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-gotodrop-front}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - gotodrop-network
    environment:
      - REACT_APP_API_URL=${API_URL:-http://localhost:8080/api}

  # Base de données H2 (optionnelle - pour persistance)
  database:
    image: oscarfonts/h2:latest
    container_name: ${DATABASE_CONTAINER_NAME:-gotodrop-h2}
    ports:
      - "${DATABASE_PORT:-1521}:1521"
      - "${DATABASE_WEB_PORT:-8082}:8082"
    environment:
      - H2_OPTIONS=-web -webAllowOthers -tcp -tcpAllowOthers -baseDir /opt/h2-data
    volumes:
      - h2-data:/opt/h2-data
    networks:
      - gotodrop-network

volumes:
  backend-data:
  h2-data:

networks:
  gotodrop-network:
    driver: bridge
