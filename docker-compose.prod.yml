version: "3.8"

services:
  # Backend Spring Boot
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-username/gotodrop/back:latest}
    container_name: ${BACKEND_CONTAINER_NAME:-gotodrop-back-prod}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker,prod}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/${DB_NAME:-proddb};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - SERVER_PORT=${BACKEND_PORT:-8080}
    volumes:
      - backend-data-prod:/app/data
      - ./logs:/app/logs
    networks:
      - gotodrop-network-prod
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
  # Frontend React/Vite
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-username/gotodrop/front:latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-gotodrop-front-prod}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gotodrop-network-prod
    environment:
      - REACT_APP_API_URL=${API_URL:-http://localhost:8080/api}
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Reverse Proxy / Load Balancer (optionnel)
  nginx:
    image: nginx:alpine
    container_name: gotodrop-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - gotodrop-network-prod
    restart: unless-stopped

  # Monitoring (optionnel)
  prometheus:
    image: prom/prometheus:latest
    container_name: gotodrop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - gotodrop-network-prod
    restart: unless-stopped

volumes:
  backend-data-prod:
  prometheus-data:

networks:
  gotodrop-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
