# Configuration pour l'environnement Docker
server.port=8080
server.address=0.0.0.0

# Configuration de la base de données H2 pour Docker
spring.datasource.url=jdbc:h2:file:/app/data/testdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuration des logs pour Docker
logging.level.com.example.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuration CORS pour Docker
cors.allowed.origins=http://localhost:3000,http://frontend:80

# Actuator pour le health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
