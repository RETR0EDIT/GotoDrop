name: 🧹 Nettoyage automatique

on:
  schedule:
    # Tous les dimanches à 3h du matin
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup-packages:
    name: 🗑️ Nettoyer les packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write    steps:
      - name: 🗑️ Delete old package versions
        uses: actions/delete-package-versions@v4
        with:
          package-name: "back"
          package-type: "container"
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

      - name: 🗑️ Delete old frontend versions
        uses: actions/delete-package-versions@v4
        with:
          package-name: "front"
          package-type: "container"
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

  cleanup-workflow-runs:
    name: 🧹 Nettoyer les exécutions de workflows
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
