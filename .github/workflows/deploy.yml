name: 🚀 Deploy GotoDrop Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/back
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/front

jobs:
  # Job 1: Tests et validation
  test:
    name: 🧪 Tests et validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: 🔧 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🧪 Tests du Backend
        run: |
          cd Backend
          mvn clean test

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Backend/target/surefire-reports/

      - name: 🏗️ Build du Backend (sans tests)
        run: |
          cd Backend
          mvn clean package -DskipTests

  # Job 2: Build et push des images Docker
  build-and-push:
    name: 🐳 Build et Push des images Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login au Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build et Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build et Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Déploiement (exemple pour serveur distant)
  deploy:
    name: 🚀 Déploiement
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production
      url: http://your-domain.com

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📋 Create deployment files
        run: |
          # Créer le docker-compose pour la production
          envsubst < docker-compose.prod.yml > docker-compose.deploy.yml
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

      - name: 🚀 Deploy to server
        run: |
          # Remplacer par vos détails de serveur
          # scp docker-compose.deploy.yml user@your-server:/path/to/deployment/
          # ssh user@your-server 'cd /path/to/deployment && docker-compose down && docker-compose pull && docker-compose up -d'
          echo "Déploiement simulé - configurez vos détails de serveur"

      - name: 🏥 Health Check
        run: |
          # Attendre que l'application soit prête
          sleep 30
          # curl -f http://your-domain.com/actuator/health
          echo "Health check simulé - configurez votre URL"

  # Job 4: Notification
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy]
    if: always()

    steps:
      - name: 📢 Notify Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Déploiement réussi!"
          # Ajoutez ici vos notifications (Slack, Discord, Email, etc.)

      - name: 📢 Notify Failure
        if: needs.test.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Échec du déploiement!"
          # Ajoutez ici vos notifications d'échec
